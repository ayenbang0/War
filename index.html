<!doctype html>
<meta charset="utf-8" />
<title>War</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9cbb0; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  canvas.panning { cursor: grabbing; }
  .panel {
    position: fixed;
    font: 11px/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace;
    color: #4a3f30;
    background: rgba(235, 227, 209, 0.78);
    border: 1px solid rgba(120, 102, 74, 0.4);
    padding: 7px 9px;
    border-radius: 3px;
    pointer-events: none;
    white-space: pre;
  }
  #hud { left: 12px; top: 12px; font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; }
  /* -- after-action report ------------------------------------------------- */
  .after-action {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(38, 32, 22, 0.86); z-index: 12; overflow: auto; padding: 24px;
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #3a3124;
  }
  .aa-panel {
    background: #e7dfcb; border: 1px solid #a3906c; border-radius: 4px;
    padding: 22px 26px; max-width: 640px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .aa-verdict { margin: 0 0 2px; font-size: 22px; letter-spacing: 1px; }
  .aa-won { color: #3b5f8a; }
  .aa-lost { color: #8c3a34; }
  .aa-drew { color: #6b5c40; }
  .aa-detail { margin: 0 0 16px; color: #7a6848; }
  .aa-panel h2 {
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    color: #8a7856; margin: 18px 0 6px; font-weight: 600;
  }
  .aa-panel h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  .aa-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .aa-col {
    border: 1px solid #cbbc9c; border-radius: 3px; padding: 8px 10px; background: #efe8d6;
  }
  .aa-stat { display: flex; justify-content: space-between; gap: 10px; }
  .aa-label { color: #5f5138; }
  .aa-value { font-weight: 600; }
  .aa-lesson {
    margin: 12px 0 0; padding: 8px 10px; background: #efe8d6;
    border-left: 3px solid #8c3a34; color: #5f5138;
  }
  .aa-companies { display: grid; gap: 3px; }
  .aa-company {
    display: grid; grid-template-columns: 1.2fr 1.4fr auto; gap: 10px;
    padding: 4px 8px; background: #efe8d6; border: 1px solid #ded2b6; border-radius: 2px;
  }
  .aa-name { font-weight: 600; }
  .aa-record { color: #7a6848; }
  .aa-fate { color: #8a7856; text-align: right; }
  .aa-log { display: grid; gap: 2px; }
  .aa-log-line { color: #5f5138; }
  .aa-again { margin-top: 20px; padding: 8px 18px; font: inherit; cursor: pointer; }
  /* -- home screen --------------------------------------------------------- */
  .home {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(38, 32, 22, 0.9); z-index: 14; overflow: auto; padding: 24px;
    font: 13px/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #3a3124;
  }
  .home-panel {
    background: #e7dfcb; border: 1px solid #a3906c; border-radius: 4px;
    padding: 34px 40px 28px; max-width: 660px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35); text-align: center;
  }
  .home-title {
    margin: 0; font-size: 58px; letter-spacing: 16px; font-weight: 600;
    color: #3b3227; text-indent: 16px;
  }
  .home-tagline { margin: 2px 0 26px; color: #7a6848; }
  .home-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 10px; }
  .home-play, .home-teach { font: inherit; cursor: pointer; padding: 13px 34px; border-radius: 3px; }
  .home-play {
    background: #3b5f8a; color: #f2ead6; border: 1px solid #2e4a6d;
    font-size: 17px; font-weight: 600; letter-spacing: 2px; padding: 13px 54px;
  }
  .home-play:hover { background: #456d9c; }
  .home-teach { background: #efe8d6; border: 1px solid #b9a880; color: #3a3124; }
  .home-teach:hover { background: #f6f0e0; }
  .home-note { margin: 6px 0 4px; color: #8a7856; font-size: 12px; }
  .home-panel h2 {
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    color: #8a7856; margin: 24px 0 8px; font-weight: 600; text-align: left;
  }
  .home-about { text-align: left; color: #5f5138; }
  .home-about p { margin: 0 0 9px; }
  .home-figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .home-figure {
    background: #efe8d6; border: 1px solid #ded2b6; border-radius: 3px; padding: 9px 6px;
  }
  .home-figure-value { font-size: 21px; font-weight: 600; color: #3b5f8a; }
  .home-figure-label { font-size: 11px; color: #8a7856; }
  .home-foot { margin: 20px 0 0; color: #9a8a68; font-size: 11px; text-align: left; }
  /* -- ability bar --------------------------------------------------------- */
  .ability-bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    display: none; gap: 8px; z-index: 6;
    font: 12px/1.3 ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  .ability {
    display: grid; grid-template-columns: auto auto; grid-auto-rows: auto;
    align-items: center; gap: 0 8px; cursor: pointer;
    background: rgba(231, 223, 203, 0.94); color: #3a3124;
    border: 1px solid #a3906c; border-radius: 3px; padding: 7px 11px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.28); font: inherit; text-align: left;
  }
  .ability:hover { background: #f2ecdb; }
  .ability.armed { border-color: #3b5f8a; background: #dce6f1; box-shadow: 0 0 0 2px #3b5f8a; }
  .ability.spent { opacity: 0.42; }
  .ability-key {
    grid-row: 1 / span 2; font-size: 15px; font-weight: 600; color: #8a7856;
    border-right: 1px solid #cbbc9c; padding-right: 8px; align-self: stretch;
    display: flex; align-items: center;
  }
  .ability-mark { font-size: 15px; }
  .ability-name { font-weight: 600; }
  .ability-count { grid-column: 2; color: #7a6848; }
  .ability-cool { grid-column: 2; color: #8c3a34; }
  #menu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(38, 32, 22, 0.82); z-index: 10; overflow: auto; padding: 24px;
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #3a3124;
  }
  .menu-panel {
    background: #e7dfcb; border: 1px solid #a3906c; border-radius: 4px;
    padding: 22px 26px; max-width: 720px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .menu-panel h1 { margin: 0 0 2px; font-size: 26px; letter-spacing: 0.14em; font-weight: 600; }
  .menu-panel h2 {
    margin: 18px 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #7a6848; font-weight: 600;
  }
  .menu-panel .sub { margin: 0 0 4px; color: #6d5c40; }
  .choices { display: flex; gap: 7px; flex-wrap: wrap; }
  .choice, .step, .primary, .secondary {
    font: inherit; cursor: pointer; border: 1px solid #a3906c;
    background: #f2ecdc; color: #3a3124; border-radius: 3px; padding: 5px 11px;
  }
  .choice.on { background: #3b5f8a; border-color: #2c496b; color: #f4efe2; }
  .blurb { margin: 6px 0 0; color: #6d5c40; min-height: 1.5em; }
  .budget { margin: 4px 0 10px; font-weight: 600; }
  .budget.over { color: #8c3a34; }
  .roster { display: grid; gap: 6px; }
  .unit {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 12px; align-items: center;
    border: 1px solid #cbbc9c; border-radius: 3px; padding: 7px 10px; background: #efe8d6;
  }
  .unit-icon {
    grid-column: 1; grid-row: 1 / span 3; display: flex;
    align-items: center; justify-content: center;
    border: 1px solid #d5c7a6; border-radius: 2px; background: #e5dcc4;
  }
  .unit-head { grid-column: 2; display: flex; gap: 10px; align-items: baseline; }
  .unit-name { font-weight: 600; }
  .unit-cost { color: #7a6848; font-size: 11px; }
  .unit-role { grid-column: 2; color: #5f5138; font-size: 12px; }
  .unit-stats { grid-column: 2; color: #8a7856; font-size: 11px; }
  .unit-controls { grid-column: 3; grid-row: 1 / span 3; display: flex; align-items: center; gap: 8px; }
  .step { width: 28px; text-align: center; padding: 4px 0; }
  .count { min-width: 18px; text-align: center; font-weight: 600; }
  .problems { color: #8c3a34; min-height: 1.4em; margin: 10px 0 0; font-size: 12px; }
  .actions { display: flex; gap: 9px; margin-top: 8px; }
  .primary { background: #3b5f8a; border-color: #2c496b; color: #f4efe2; font-weight: 600; }
  .primary:disabled { background: #b9b09a; border-color: #a3906c; cursor: not-allowed; }
  .hint { color: #6d5c40; margin: 10px 0 0; font-size: 12px; }
</style>
<canvas id="stage"></canvas>
<div id="home"></div>
<div id="menu"></div>
<div id="report"></div>
<div id="hud" class="panel"></div>
<div id="abilities"></div>
<script type="module" src="/src/main.ts"></script>
