<!doctype html>
<meta charset="utf-8" />
<title>War</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9cbb0; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  canvas.panning { cursor: grabbing; }
  .panel {
    position: fixed;
    font: 11px/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace;
    color: #4a3f30;
    background: rgba(235, 227, 209, 0.78);
    border: 1px solid rgba(120, 102, 74, 0.4);
    padding: 7px 9px;
    border-radius: 3px;
    pointer-events: none;
    white-space: pre;
  }
  #hud { left: 12px; top: 12px; font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; }
  #menu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(38, 32, 22, 0.82); z-index: 10; overflow: auto; padding: 24px;
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #3a3124;
  }
  .menu-panel {
    background: #e7dfcb; border: 1px solid #a3906c; border-radius: 4px;
    padding: 22px 26px; max-width: 720px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .menu-panel h1 { margin: 0 0 2px; font-size: 26px; letter-spacing: 0.14em; font-weight: 600; }
  .menu-panel h2 {
    margin: 18px 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #7a6848; font-weight: 600;
  }
  .menu-panel .sub { margin: 0 0 4px; color: #6d5c40; }
  .choices { display: flex; gap: 7px; flex-wrap: wrap; }
  .choice, .step, .primary, .secondary {
    font: inherit; cursor: pointer; border: 1px solid #a3906c;
    background: #f2ecdc; color: #3a3124; border-radius: 3px; padding: 5px 11px;
  }
  .choice.on { background: #3b5f8a; border-color: #2c496b; color: #f4efe2; }
  .blurb { margin: 6px 0 0; color: #6d5c40; min-height: 1.5em; }
  .budget { margin: 4px 0 10px; font-weight: 600; }
  .budget.over { color: #8c3a34; }
  .roster { display: grid; gap: 6px; }
  .unit {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center;
    border: 1px solid #cbbc9c; border-radius: 3px; padding: 7px 10px; background: #efe8d6;
  }
  .unit-head { display: flex; gap: 10px; align-items: baseline; }
  .unit-name { font-weight: 600; }
  .unit-cost { color: #7a6848; font-size: 11px; }
  .unit-role { grid-column: 1; color: #5f5138; font-size: 12px; }
  .unit-stats { grid-column: 1; color: #8a7856; font-size: 11px; }
  .unit-controls { grid-column: 2; grid-row: 1 / span 3; display: flex; align-items: center; gap: 8px; }
  .step { width: 28px; text-align: center; padding: 4px 0; }
  .count { min-width: 18px; text-align: center; font-weight: 600; }
  .problems { color: #8c3a34; min-height: 1.4em; margin: 10px 0 0; font-size: 12px; }
  .actions { display: flex; gap: 9px; margin-top: 8px; }
  .primary { background: #3b5f8a; border-color: #2c496b; color: #f4efe2; font-weight: 600; }
  .primary:disabled { background: #b9b09a; border-color: #a3906c; cursor: not-allowed; }
  .hint { color: #6d5c40; margin: 10px 0 0; font-size: 12px; }
</style>
<canvas id="stage"></canvas>
<div id="menu"></div>
<div id="hud" class="panel"></div>
<script type="module" src="/src/main.ts"></script>
